spring.application.name=ms-operaciones

spring.datasource.url=jdbc:sqlserver://serv-cpsp.database.windows.net:1433;databaseName=sistemasCPSP;encrypt=true;trustServerCertificate=false;authentication=ActiveDirectoryDefault;loginTimeout=30

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true


# JWT
app.jwt.issuer=ms-operaciones
app.jwt.expiration-minutes=30
app.jwt.secret-base64=${JWT_SECRET_BASE64}
