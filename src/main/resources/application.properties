spring.application.name=ms-operaciones
spring.profiles.default=dev

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=none

# JWT
app.jwt.issuer=ms-operaciones
app.jwt.expiration-minutes=30
app.jwt.secret-base64=${JWT_SECRET_BASE64:}

# API Perú - consulta DNI con dirección. Configura APIPERU_DNI_TOKEN en el entorno.
apiperu.dni-direccion.url=${APIPERU_DNI_URL:https://api.apiperu.pe/dni-direccion}
apiperu.dni-direccion.token=${APIPERU_DNI_TOKEN:}
