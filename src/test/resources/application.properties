# Context tests use an in-memory database and never require Azure SQL.
spring.datasource.url=jdbc:h2:mem:ms_operaciones_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Properties otherwise supplied by the production application.properties.
spring.application.name=ms-operaciones
app.jwt.issuer=ms-operaciones
app.jwt.expiration-minutes=30

# Test-only key: 32 bytes after Base64 decoding. Do not reuse in deployed environments.
app.jwt.secret-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

apiperu.dni-direccion.url=https://api.apiperu.pe/dni-direccion
apiperu.dni-direccion.token=
